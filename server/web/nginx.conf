# Hevyfin web: the nginx container's default.conf, written by install.sh from this template
# (${JELLYFIN_UPSTREAM}, ${SEERR_UPSTREAM} and ${NIQL_UPSTREAM} are filled in with envsubst).
# It serves the browser version and the phone APK, and passes Jellyfin, Seerr and the optional
# recommendation service through on the same address: the browser then needs no CORS, and
# Seerr's session cookie is the page's own. Keep it on your LAN or VPN, or put HTTPS in front.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8090;
    server_name _;
    root /srv/site;

    # Stream, subtitle and socket addresses carry sign-in keys.
    access_log off;

    # The Flutter build is about 9 MB (main.dart.js and CanvasKit's wasm), about 3.5 MB
    # compressed: deploy-web.sh ships .gz copies, and anything else is compressed on the fly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/javascript application/wasm application/json text/css text/plain text/vtt image/svg+xml font/ttf font/otf application/octet-stream;

    # Flutter's entry files are always checked for a newer build; the rest may be cached.
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)?$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /get/ {
        add_header Cache-Control "no-cache";
    }

    # The Vue browser version (browser/), next to the Flutter build at /next/.
    # Its scripts and styles carry a hash in their names, so they're kept for a year; the
    # page itself is always checked for a newer build.
    location /next/assets/ {
        root /srv;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /next/ {
        root /srv;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /next/index.html;
    }

    # The newest phone APK and latest.json, put there by you (docs/self-hosting-web.md).
    location /apk/ {
        alias /srv/apk/;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        add_header Cache-Control "no-cache";
    }

    location /jellyfin/ {
        proxy_pass ${JELLYFIN_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 20m;
    }

    # Jellyfin's live socket (remote control, watch together). A browser can't send the
    # Authorization header and Jellyfin refuses a key in the address, so the page sends
    # api_key and it goes on as the header, not in the address.
    location = /jellyfin/socket {
        proxy_pass ${JELLYFIN_UPSTREAM}/socket?deviceId=$arg_deviceId;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization 'MediaBrowser Client="Hevyfin", Device="Web", DeviceId="$arg_deviceId", Version="web", Token="$arg_api_key"';
        proxy_read_timeout 1h;
    }

    location /seerr/ {
        proxy_pass ${SEERR_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The optional recommendation service behind "Ask" (docs/niql.md); answers can take a
    # minute or two. install.sh leaves this block out when NIQL_UPSTREAM is empty.
    # NIQL-BEGIN
    location /niql/ {
        proxy_pass ${NIQL_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    # NIQL-END
}
